# Tiene attivo il progetto Supabase gratuito: senza attività per 7 giorni Supabase lo mette in pausa.
# Ogni giorno fa una piccola lettura pubblica dal database (la stessa che fa il sito).
# Si può avviare anche a mano da GitHub → Actions → "Supabase keep-alive" → Run workflow.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # tutti i giorni alle 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura dal database
        env:
          SUPABASE_URL: https://yqevubcpaloxwjxvqchc.supabase.co
          # Chiave pubblica (publishable): è la stessa già presente nel sito
          SUPABASE_KEY: sb_publishable_k1k4T-5GkQphLxlH-OJ2kw_qH2zqBd9
        run: |
          status=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Risposta Supabase: $status"
          cat /tmp/out.json
          if [ "$status" != "200" ]; then
            echo "::error::Supabase non risponde (HTTP $status). Potrebbe essere in pausa: riattivalo dal pannello."
            exit 1
          fi
